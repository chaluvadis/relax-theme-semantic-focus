name: Build & Release VS Code Extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          OUT="di-service-navigator-${TAG}.vsix"

          echo "OUT=${OUT}" >> "$GITHUB_ENV"
          echo "Packaging VSIX -> ${OUT}"

          pnpm exec vsce package --out "${OUT}"

      - name: Verify VSIX
        shell: bash
        run: |
          if [ ! -f "${OUT}" ]; then
            echo "ERROR: VSIX was not created: ${OUT}" >&2
            exit 1
          fi

          echo "Created:"
          ls -lh "${OUT}"

      - name: Check VSCE token
        shell: bash
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ -z "${VSCE_TOKEN}" ]; then
            echo "ERROR: VSCE_TOKEN repository secret is not set." >&2
            exit 1
          fi

      - name: Publish to Visual Studio Marketplace
        shell: bash
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          echo "Publishing ${OUT} to Visual Studio Marketplace"

          pnpm exec vsce publish \
            --packagePath "${OUT}" \
            --pat "${VSCE_TOKEN}"

      - name: Create GitHub Release and upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.OUT }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
